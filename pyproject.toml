    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.12.4",
