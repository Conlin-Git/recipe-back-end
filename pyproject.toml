    "neo4j>=6.3.0",
    "nh3>=0.3.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "passlib>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pymilvus>=3.0.1",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
