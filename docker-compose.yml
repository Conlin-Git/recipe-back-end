services:
  # ===== MySQL 8.0 主数据库 =====
  mysql:
    image: mysql:8.0
    container_name: recipe-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: recipebot123
      MYSQL_DATABASE: recipe_bot
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./data/mysql:/var/lib/mysql

  # ===== etcd（Milvus依赖，用官方arm64兼容版） =====
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: milvus-etcd
    restart: always
    platform: linux/amd64
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - ./data/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  # ===== MinIO（Milvus依赖） =====
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: milvus-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  # ===== Milvus 向量数据库 =====
  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: milvus-standalone
    restart: always
    platform: linux/amd64
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./data/milvus/milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    command: ["milvus", "run", "standalone"]

  # ===== Redis（会话热上下文缓存） =====
  redis:
    image: redis:7-alpine
    container_name: recipe-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes

      # ===== Neo4j 知识图谱 =====
  neo4j:
    image: neo4j:5.16-community
    container_name: recipe-neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/recipeAgent
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
      # 加上下面这行：启用APOC插件自动下载
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs